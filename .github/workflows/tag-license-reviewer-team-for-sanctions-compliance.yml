name: Tag license-reviewer team for Sanctions Compliance

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  tag-team:
    runs-on: ubuntu-slim
    if: github.event.label.name == 'license-reviews'
    steps:
      - name: Tag license-reviewer team for Sanctions Compliance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@brave/license-reviewer This issue/PR has been labeled `license-reviews` and requires your attention.'
            })
